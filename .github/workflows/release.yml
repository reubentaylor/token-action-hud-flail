name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Update module.json version + URLs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq \
            --arg version "$VERSION" \
            --arg download "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/module.zip" \
            '.version = $version | .download = $download' \
            module.json > module.json.tmp
          mv module.json.tmp module.json
          echo "module.json after edit:"
          cat module.json

      - name: Build module.zip
        run: |
          zip -r module.zip \
            module.json \
            README.md \
            scripts/ \
            styles/ \
            languages/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          files: |
            module.zip
            module.json
          generate_release_notes: true
